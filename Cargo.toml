[package]
name = "day-lite"
version = "0.4.3"
edition = "2024"
# Day's own minimum. The oxc crates below declare 1.96.
rust-version = "1.100"
description = "JavaScript and TypeScript miniapps on Day's native pieces, embedded in a host app"
repository = "https://github.com/daybrite/day-lite"
license = "MPL-2.0"

# Daybrite-owned dependencies accept every stable 0.x release. Apps retain a tested
# dependency set with Cargo.lock; updating it may require source changes.

[features]
# The bundled SQLite, on by default: the engine every mobile target cross-compiles. A
# superapp linking the OS's libsqlite3 instead uses default-features = false and picks its
# engine through day-persistence's own features.
default = ["bundled"]
bundled = ["day-persistence/bundled"]

[package.metadata.day]
# Accept the pre-1.0 series; source compatibility between releases is not guaranteed.
compat = "0.*"

[dependencies]
log = "0.4"
day-reactive = "0.*"
day-core = "0.*"
day-spec = "0.*"
day-pieces = { version = "0.*", features = ["dyn-registry"] }
day-part-http = "0.*"
day-part-preferences = "0.*"

# The JS engine: QuickJS. `bindgen` because rquickjs ships no prebuilt bindings for the
# mobile cross-targets (docs/lite.md §13); the day CLI supplies the sysroot/ar env the
# build scripts need per target.
rquickjs = { version = "0.13", features = ["bindgen", "loader"] }

# TypeScript type-stripping at module load (docs/lite.md §1).
oxc_allocator = "0.150"
oxc_parser = "0.150"
oxc_semantic = "0.150"
oxc_transformer = "0.150"
oxc_codegen = "0.150"
oxc_span = "0.150"

# Built-in persistence (docs/lite.md §7) rides day-persistence's `SqliteDriver` trait, so a
# superapp carrying both compiles one SQLite and the engine features the app picks on
# day-persistence (`system`, `cipher`) govern miniapp storage too. The `bundled` default keeps
# the engine every mobile target cross-compiles; a system-engine build turns it off
# (default-features = false).
day-persistence = { version = "0.*", default-features = false, features = ["driver-rusqlite"] }

# Per-miniapp Fluent bundles (docs/lite.md §7), the same crate/version day-localization builds on.
fluent-bundle = "0.16"
day-localization = "0.*"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
day-mock = "0.*"

# Lint policy: Clippy's `pedantic` group, and CI treats every warning as an error. The table
# matches `day`'s.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"
