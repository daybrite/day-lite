[package]
name = "day-lite"
version = "0.4.3"
edition = "2024"
# The oxc crates below declare 1.96. Inside day's workspace this crate inherited 1.89, which it
# could never build with.
rust-version = "1.96"
description = "JavaScript and TypeScript miniapps on Day's native pieces, embedded in a host app"
repository = "https://github.com/daybrite/day-lite"
license = "MPL-2.0"
# The day framework crates are not on crates.io yet; neither is this one. Apps depend on it
# from git, exactly as they depend on day.
publish = false

# Every day dependency names the bare canonical URL: no branch, tag, or rev. Cargo unifies a git
# dependency only when URL and ref match, so an app on `git = "…/day.git"` and a crate pinned to
# a tag would carry two copies of every day crate; leaving the ref off lets the app's Cargo.lock
# choose one revision for the whole graph. No lock is committed here (see .gitignore), and
# `compat` below says which day minor this release is built and tested against.

[features]
# The bundled SQLite, on by default: the engine every mobile target cross-compiles. A
# superapp linking the OS's libsqlite3 instead uses default-features = false and picks its
# engine through day-persistence's own features.
default = ["bundled"]
bundled = ["day-persistence/bundled"]

[package.metadata.day]
# The day minor this release is built and tested against. `day build` notes a mismatch.
compat = "0.5"

[dependencies]
log = "0.4"
day-reactive = { git = "https://github.com/daybrite/day.git" }
day-core = { git = "https://github.com/daybrite/day.git" }
day-spec = { git = "https://github.com/daybrite/day.git" }
day-pieces = { git = "https://github.com/daybrite/day.git", features = ["dyn-registry"] }
day-part-http = { git = "https://github.com/daybrite/day.git" }
day-part-prefs = { git = "https://github.com/daybrite/day.git" }

# The JS engine: QuickJS. `bindgen` because rquickjs ships no prebuilt bindings for the
# mobile cross-targets (docs/lite.md §13); the day CLI supplies the sysroot/ar env the
# build scripts need per target.
rquickjs = { version = "0.13", features = ["bindgen", "loader"] }

# TypeScript type-stripping at module load (docs/lite.md §1).
oxc_allocator = "0.150"
oxc_parser = "0.150"
oxc_semantic = "0.150"
oxc_transformer = "0.150"
oxc_codegen = "0.150"
oxc_span = "0.150"

# Built-in persistence (docs/lite.md §7) rides day-persistence's `SqliteDriver` trait, so a
# superapp carrying both compiles one SQLite and the engine features the app picks on
# day-persistence (`system`, `cipher`) govern miniapp storage too. The `bundled` default keeps
# the engine every mobile target cross-compiles; a system-engine build turns it off
# (default-features = false).
day-persistence = { git = "https://github.com/daybrite/day-persistence.git", default-features = false, features = ["driver-rusqlite"] }

# Per-miniapp Fluent bundles (docs/lite.md §7), the same crate/version day-l10n builds on.
fluent-bundle = "0.16"
day-l10n = { git = "https://github.com/daybrite/day.git" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
day-mock = { git = "https://github.com/daybrite/day.git" }
